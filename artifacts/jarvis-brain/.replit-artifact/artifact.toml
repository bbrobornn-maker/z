kind = "web"
previewPath = "/brain/"
title = "Jarvis Brain"
version = "1.0.0"
id = "artifacts/jarvis-brain"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/brain/" ]
localPort = 18802

[services.development]
run = "pnpm --filter @workspace/jarvis-brain run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jarvis-brain", "run", "build" ]
publicDir = "artifacts/jarvis-brain/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18802"
BASE_PATH = "/brain/"
